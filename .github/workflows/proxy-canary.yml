# Canary: pings the LiteLLM proxy on a schedule so we KNOW it's up, not hope so.
# A failing run emails the repo admins (GitHub's default notification).
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   PROXY_URL         e.g. https://parsity-litellm.fly.dev
#   PROXY_CANARY_KEY  a dedicated low-budget key minted via new-cohort.sh
name: proxy-canary

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch: {}       # allow manual runs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$PROXY_URL/health/readiness")
          echo "readiness -> $code"
          test "$code" = "200"
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}

      - name: Live model call (real end-to-end)
        run: |
          resp=$(curl -s -w '\n%{http_code}' "$PROXY_URL/v1/chat/completions" \
            -H "Authorization: Bearer $PROXY_CANARY_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"ping"}],"max_tokens":1}')
          body=$(echo "$resp" | head -n -1); code=$(echo "$resp" | tail -n1)
          echo "completion -> $code"
          echo "$body" | head -c 400
          test "$code" = "200"
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_CANARY_KEY: ${{ secrets.PROXY_CANARY_KEY }}

      # Jev rides a pass-through route, so the model call above does NOT cover
      # it — a broken TYPESAFE_API_KEY or a bad route is invisible until a
      # student hits it in week 5.
      - name: Live Jev call (the week-5 eval judge)
        run: |
          resp=$(curl -s -w '\n%{http_code}' "$PROXY_URL/v1/systemone" \
            -H "Authorization: Bearer $PROXY_CANARY_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"jev-latest",
                 "state":{"text":"The patient is doing well."},
                 "questions":{"positive":{"type":"noul","instructions":"Is the tone positive?"}}}')
          body=$(echo "$resp" | head -n -1); code=$(echo "$resp" | tail -n1)
          echo "systemone -> $code"
          echo "$body" | head -c 400
          test "$code" = "200"
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_CANARY_KEY: ${{ secrets.PROXY_CANARY_KEY }}

      # The pass-through route injects OUR TypeSafe key. If `auth: true` ever
      # falls out of litellm-config.yaml, the route becomes an open relay that
      # anyone who knows the URL can spend. This step fails if that happens.
      - name: Jev route rejects unauthenticated callers
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$PROXY_URL/v1/systemone" \
            -H "Content-Type: application/json" -d '{}')
          echo "unauthenticated systemone -> $code (want 401/403)"
          case "$code" in
            401|403) ;;
            # 422 means TypeSafe validated the body, i.e. LiteLLM forwarded an
            # unauthenticated request. Only TypeSafe can produce it here.
            422) echo "::error::auth NOT enforced on /v1/systemone (422 = request reached TypeSafe) — rotate TYPESAFE_API_KEY and restore 'auth: true'"; exit 1 ;;
            2*) echo "::error::OPEN RELAY on /v1/systemone — rotate TYPESAFE_API_KEY and restore 'auth: true'"; exit 1 ;;
            *) echo "::error::unexpected status $code from unauthenticated /v1/systemone"; exit 1 ;;
          esac
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
